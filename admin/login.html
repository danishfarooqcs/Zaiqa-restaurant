<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Zaiqa Royal Kitchen</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body
    class="bg-brand-dark text-stone-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-brand-card border border-stone-800 rounded-2xl p-8 shadow-2xl"
    >
      <div class="text-center mb-8">
        <span
          class="inline-block px-3 py-1 text-xs font-semibold tracking-wider uppercase rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-3"
        >
          Admin Control Panel
        </span>
        <h1 class="text-3xl font-bold text-white">Staff Access</h1>
        <p class="text-stone-400 text-sm mt-2">
          Enter admin PIN to manage menu, orders & WhatsApp settings
        </p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label
            for="adminPin"
            class="block text-sm font-medium text-stone-300 mb-1.5"
            >Admin PIN</label
          >
          <input
            type="password"
            id="adminPin"
            value="admin123"
            required
            class="w-full px-4 py-3 rounded-xl bg-stone-900 border border-stone-700 text-white focus:outline-none focus:border-amber-500"
            placeholder="Enter PIN (default: admin123)"
          />
        </div>

        <p id="loginError" class="text-sm text-rose-400 hidden">
          Incorrect PIN. Try <code>admin123</code>.
        </p>

        <button
          type="submit"
          class="w-full py-3 px-4 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold transition cursor-pointer"
        >
          Unlock Dashboard
        </button>
      </form>

      <div
        class="mt-6 pt-5 border-t border-stone-800 flex items-center justify-between text-xs text-stone-400"
      >
        <span
          >Default PIN: <strong class="text-stone-200">admin123</strong></span
        >
        <a href="../index.html" class="text-amber-400 hover:underline"
          >← Back to Storefront</a
        >
      </div>
    </div>

    <script type="module">
      import { Store } from "../src/js/store.js";

      const form = document.getElementById("loginForm");
      const pinInput = document.getElementById("adminPin");
      const errorEl = document.getElementById("loginError");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const settings = Store.getSettings();
        if (pinInput.value.trim() === settings.adminPin) {
          sessionStorage.setItem("restro_admin_auth", "true");
          window.location.href = "./dashboard.html";
        } else {
          errorEl.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
